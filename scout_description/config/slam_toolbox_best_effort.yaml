slam_toolbox:
  ros__parameters:
    mode: mapping
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    odom_topic: /odom
    publish_tf: true
    use_sim_time: false
    transform_publish_period: 0.02
    map_update_interval: 1.0
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1
    scan_buffer_size: 200
    resolution: 0.05
    max_laser_range: 20.0
    transform_tolerance: 0.5
    use_sim_time: false
    correlation_search_space_scale: 0.5
    correlation_search_space_smear_deviation: 0.1
    motion_model_trans_trans: 0.1
    motion_model_trans_rot: 0.1
    motion_model_rot_rot: 0.1
    odom_topic_qos:
      reliability: best_effort
      durability: volatile
      history: keep_last
      depth: 10 